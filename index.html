<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>የህፃናት እና ታዳጊዎች ክፍል</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@600;700&family=Noto+Sans+Ethiopic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF6EC;
    --cream-2: #F3EAD8;
    --panel: #FFFFFF;
    --ink: #3A2E22;
    --ink-dim: #8A7A63;
    --terra: #C1683A;
    --terra-dim: #E0A57F;
    --sage: #7C9473;
    --gold: #D3A24A;
    --danger: #B5563C;
    --border: #E7DCC6;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Sans Ethiopic', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Noto Serif Ethiopic', serif; font-weight: 700; margin: 0 0 12px; color: var(--terra); }
  h1 { font-size: 17px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; color: var(--ink); }

  header.topbar {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex; align-items: center; gap: 10px;
  }
  header.topbar .brand-mark {
    width: 30px; height: 30px; border-radius: 50%; background: var(--terra);
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff;
  }
  header.topbar h1 { margin: 0; }

  #app { flex: 1; padding: 14px; padding-bottom: 84px; max-width: 900px; width: 100%; margin: 0 auto; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(58,46,34,0.06); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  .today-banner { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-dim); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .today-banner strong { color: var(--terra); }

  .main-goal { font-style: italic; }

  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-card { flex: 1 1 140px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--cream-2); }
  .stat-card .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; }
  .stat-card .stat-label { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
  .stat-card .stat-sub { font-size: 10px; color: var(--ink-dim); margin-top: 4px; opacity: 0.85; }
  .stat-card.good .stat-value { color: var(--sage); }
  .stat-card.danger .stat-value { color: var(--danger); }
  .stat-card.neutral .stat-value { color: var(--terra); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 120px; }

  input, select, textarea {
    background: var(--cream); color: var(--ink); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-family: inherit; font-size: 13.5px; width: 100%;
  }
  textarea { resize: vertical; }
  input[type=checkbox] { width: auto; accent-color: var(--terra); }

  .btn { border: 1px solid var(--terra-dim); background: transparent; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn.primary { background: var(--terra); border-color: var(--terra); color: #fff; font-weight: 600; }
  .btn.ghost { border-color: var(--border); color: var(--ink-dim); }
  .btn.small { padding: 5px 12px; font-size: 12px; }
  .btn.danger-text { color: var(--danger); border-color: var(--danger); margin-top: 8px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 2px 4px; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
  table.data-table th { color: var(--terra); font-weight: 600; font-size: 12px; }
  table.data-table td.row-actions { white-space: nowrap; width: 1%; }
  .list-host { overflow-x: auto; }

  .empty, .muted { color: var(--ink-dim); font-size: 13px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(58,46,34,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; padding: 20px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } .modal-card { border-radius: var(--radius); } }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 4px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  .due-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .due-item { display: flex; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--cream-2); font-size: 13px; }
  .due-date { font-family: 'IBM Plex Mono', monospace; color: var(--terra); font-size: 12px; }

  .plan-list { display: flex; flex-direction: column; gap: 10px; }
  .plan-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--cream-2); }
  .plan-card-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .plan-no { font-family: 'IBM Plex Mono', monospace; color: var(--ink-dim); font-size: 12px; }
  .plan-details { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 8px; }
  .plan-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .meta-chip { font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--ink-dim); background: #fff; }
  .meta-chip .meta-label { color: var(--terra); margin-right: 4px; }
  .plan-due { font-size: 13px; margin-bottom: 8px; }
  .plan-actions { display: flex; justify-content: flex-end; }
  .plan-history { margin-top: 8px; font-size: 12px; color: var(--ink-dim); }
  .plan-history summary { cursor: pointer; color: var(--terra); }
  .history-row { padding: 4px 0; border-top: 1px dashed var(--border); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }

  .attend-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .attend-name { font-size: 14px; flex: 1; }
  .attend-sub { font-size: 11px; color: var(--ink-dim); background: var(--cream-2); border-radius: 999px; padding: 2px 8px; }

  .followup-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--cream-2); margin-bottom: 10px; }
  .followup-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .followup-count { font-size: 12px; color: var(--danger); font-family: 'IBM Plex Mono', monospace; }
  .followup-called { font-size: 12.5px; color: var(--sage); margin-bottom: 4px; }
  .followup-reason { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 6px; }
  .followup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .followup-actions a.btn { text-decoration: none; text-align: center; }

  .lang-toggle { display: flex; gap: 6px; }
  .auth-panel { border-top: 1px dashed var(--border); margin-top: 16px; padding-top: 16px; }
  .error-text { color: var(--danger); font-size: 12.5px; }

  .auth-gate { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .auth-gate-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 22px; }
  .auth-gate-card h1 { text-align: center; margin-bottom: 4px; }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 6px 2px;
    z-index: 20;
  }
  .tab-btn { background: none; border: none; color: var(--ink-dim); font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; cursor: pointer; flex: 1; }
  .tab-btn.active { color: var(--terra); }
  .tab-icon { font-size: 17px; }
  .tab-label { font-size: 10px; }

  @media (min-width: 780px) {
    body { flex-direction: row; }
    #tabbar { position: static; flex-direction: column; width: 190px; height: 100vh; justify-content: flex-start; gap: 4px; padding: 16px 10px; border-top: none; border-right: 1px solid var(--border); }
    .tab-btn { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; }
    .tab-btn.active { background: var(--cream-2); }
    .tab-label { font-size: 13px; }
    #app { padding: 24px; padding-bottom: 24px; max-width: 760px; }
    header.topbar { display: none; }
  }

  @media print { #tabbar, header.topbar, .toolbar, .form-actions, .plan-actions { display: none !important; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">🧒</div>
    <h1 data-i18n="app_title">የህፃናት እና ታዳጊዎች ክፍል</h1>
  </header>

  <nav id="tabbar"></nav>
  <main id="app"></main>

  <!-- CDN libraries, cached by the service worker after first online load -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="ethiopian-calendar.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="plan-seed.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
